name: TradingBot - Paper Session

on:
  # Disparo redundante del disparo diario.  El dispatcher principal es el
  # controlador (telegram-controller.yml), que arranca la sesión dentro de la
  # ventana 08:00-13:00 y garantiza la recuperación; pero los cron de GitHub
  # Actions se ejecutan con retraso (en este repo se han medido retrasos de
  # 4-6 h), así que un segundo disparador con la misma semántica da otra
  # oportunidad dentro del día.
  #
  # Es seguro que convivan los dos:
  #  - el gate usa la misma ventana 08:00-14:00 y el grupo de concurrencia
  #    (cancel-in-progress: false) impide dos runners a la vez;
  #  - un run que arranque fuera de la ventana se cierra solo;
  #  - el controlador no duplica: comprueba los runs del día y los estados
  #    activo/en cola antes de despachar.
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "America/Havana"
  workflow_dispatch:
    inputs:
      restore_state:
        description: "Restaurar el estado persistido (estrategias, historial y cuenta)"
        required: false
        default: true
        type: boolean
      strategy_id:
        description: "ID de la estrategia Investing Bulls a ejecutar"
        required: false
        default: ""
        type: string
      manual_session:
        description: "Arranque manual desde Telegram: sesión PAPER completa de 6 horas"
        required: false
        default: false
        type: boolean

concurrency:
  group: tradingbot-paper-session
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  paper-session:
    name: WEEX paper trading - sesión La Habana
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TRADING_MODE: paper
      MODE: paper
      MARKET_DATA_PROVIDER: weex
      TRADING_SYMBOL: BTCUSDT
      TRADING_TIMEFRAME: 1h
      WEEX_PRICE_TYPE: LAST_PRICE
      WEEX_BACKFILL_BARS: 5000
      INGEST_ENABLED: "false"
      WATCH_TRADES: "false"

      # La ventana real de la sesión es 08:00 → 14:00 hora de Cuba. Con
      # manual_session=false el gate sigue el horario y el runner termina solo
      # al cerrar la ventana; con manual_session=true la sesión dura las 6 horas
      # del timeout del workflow.
      TRADING_SESSION_ENABLED: "true"
      TRADING_SESSION_START_ACTIVE: ${{ inputs.manual_session == true && 'true' || 'false' }}
      TRADING_SESSION_SCHEDULE_ENABLED: ${{ inputs.manual_session == true && 'false' || 'true' }}
      TRADING_SESSION_START: "08:00"
      TRADING_SESSION_END: "14:00"
      TRADING_SESSION_TIMEZONE: America/Havana
      TRADING_SESSION_EXIT_AFTER_WINDOW: "true"

      INVESTING_BULLS_MAIN_TIMEFRAME: 1h
      INVESTING_BULLS_ENTRY_TIMEFRAME: 15m
      INVESTING_BULLS_CONFIRM_TIMEFRAME: 5m
      INVESTING_BULLS_CONFIRM_5M: "true"
      INVESTING_BULLS_SYMBOL: BTCUSDT
      INVESTING_BULLS_STRATEGY_ID: ${{ inputs.strategy_id || vars.INVESTING_BULLS_STRATEGY_ID }}

      RISK_ENABLED: "true"
      DB_FILE: data/bot.db
      STORAGE_FILE: data/users.json
      PORT: "8080"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Chat al que el runner avisa de que ha arrancado y de que se detiene.
      TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: Restore persisted state
        if: ${{ inputs.restore_state != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data restore
          artifact_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "tradingbot-state" and .expired == false)) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"

          if [[ -z "${artifact_run_id}" ]]; then
            echo "No hay estado persistido anterior; se inicia una base nueva."
            exit 0
          fi

          echo "Restaurando estado desde la ejecución ${artifact_run_id}..."
          gh run download "${artifact_run_id}" --repo "${GITHUB_REPOSITORY}" --name tradingbot-state --dir restore

          if [[ -f restore/tradingbot-state.tgz ]]; then
            tar -xzf restore/tradingbot-state.tgz
            echo "Estado restaurado."
          else
            echo "ERROR: el artefacto existe pero no contiene tradingbot-state.tgz."
            exit 1
          fi

      - name: Validate, test and build
        run: |
          go version
          go test ./...
          go build -o bot .

      - name: Run paper session
        env:
          # Permite que el propio runner cancele su ejecución al recibir
          # /session_stop o /stop desde Telegram (githubactions.NewFromEnv).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bot

      - name: Archive persistent state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ -f data/bot.db ]]; then
            tar -czf tradingbot-state.tgz data/bot.db* data/users.json 2>/dev/null || true
            ls -lh tradingbot-state.tgz
          else
            echo "No existe data/bot.db; no se sube estado."
          fi

      - name: Upload persistent state
        if: always() && hashFiles('tradingbot-state.tgz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: tradingbot-state
          path: tradingbot-state.tgz
          if-no-files-found: error
          retention-days: 90
