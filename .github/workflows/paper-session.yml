name: TradingBot - Paper Session

on:
  # 08:00 New York de lunes a viernes. La ventana real del bot termina a las 14:00.
  # El workflow puede arrancar con unos minutos de retraso sin cambiar la zona horaria.
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: tradingbot-paper-session
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  paper-session:
    name: WEEX paper trading - sesión NY
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TRADING_MODE: paper
      MODE: paper
      MARKET_DATA_PROVIDER: weex
      TRADING_SYMBOL: BTCUSDT
      TRADING_TIMEFRAME: 1h
      WEEX_PRICE_TYPE: LAST_PRICE
      WEEX_BACKFILL_BARS: 5000
      INGEST_ENABLED: "false"
      WATCH_TRADES: "false"

      TRADING_SESSION_ENABLED: "true"
      TRADING_SESSION_START_ACTIVE: "false"
      TRADING_SESSION_SCHEDULE_ENABLED: "true"
      TRADING_SESSION_START: "08:00"
      TRADING_SESSION_END: "14:00"
      TRADING_SESSION_TIMEZONE: America/New_York
      TRADING_SESSION_EXIT_AFTER_WINDOW: "true"

      INVESTING_BULLS_MAIN_TIMEFRAME: 1h
      INVESTING_BULLS_ENTRY_TIMEFRAME: 15m
      INVESTING_BULLS_CONFIRM_TIMEFRAME: 5m
      INVESTING_BULLS_CONFIRM_5M: "true"
      INVESTING_BULLS_SYMBOL: BTCUSDT
      INVESTING_BULLS_STRATEGY_ID: ${{ vars.INVESTING_BULLS_STRATEGY_ID }}

      RISK_ENABLED: "true"
      DB_FILE: data/bot.db
      STORAGE_FILE: data/users.json
      PORT: "8080"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: Restore persisted state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data restore
          artifact_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts
              | map(select(.name == "tradingbot-state" and .expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].workflow_run.id // empty')"

          if [[ -z "${artifact_run_id}" ]]; then
            echo "No hay estado persistido anterior; se inicia una base nueva."
            exit 0
          fi

          echo "Restaurando estado desde la ejecución ${artifact_run_id}..."
          gh run download "${artifact_run_id}"             --repo "${GITHUB_REPOSITORY}"             --name tradingbot-state             --dir restore

          if [[ -f restore/tradingbot-state.tgz ]]; then
            tar -xzf restore/tradingbot-state.tgz
            echo "Estado restaurado."
          else
            echo "ERROR: el artefacto existe pero no contiene tradingbot-state.tgz."
            exit 1
          fi

      - name: Validate, test and build
        run: |
          go version
          go test ./...
          go build -o bot .

      - name: Run paper session
        run: |
          ./bot

      - name: Archive persistent state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ -f data/bot.db ]]; then
            tar -czf tradingbot-state.tgz \
              data/bot.db \
              data/bot.db-wal \
              data/bot.db-shm \
              data/users.json 2>/dev/null || true
            ls -lh tradingbot-state.tgz
          else
            echo "No existe data/bot.db; no se sube estado."
          fi

      - name: Upload persistent state
        if: always() && hashFiles('tradingbot-state.tgz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tradingbot-state
          path: tradingbot-state.tgz
          if-no-files-found: error
          retention-days: 90
